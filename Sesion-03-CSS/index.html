<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos — Tarea CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Galería de Productos Tecnológicos</h1>

        <!-- TODO: Galería de productos
             Cada tarjeta debe contener:
             - Imagen del producto (usa placeholder o imágenes de ejemplo)
             - Nombre del producto
             - Precio
             - Botón con texto "Comprar"
             
             Desktop (>=1024px): 3 columnas
             Mobile (<768px): 1 columna con scroll vertical
        -->
        <section class="galeria">

            <article class="producto">
                <img src="img/microfono.jpg" alt="microfono USB">
                <div class="producto-info">
                    <h2>Micrófono USB para podcast</h2>
                    <p class="precio">Q99.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="img/powerbank.jpg" alt="Xiaomi, Power Bank 20,000mAh 33W">
                <div class="producto-info">
                    <h2>Xiaomi power bank 20000mAh</h2>
                    <p class="precio">Q264.11</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="img/pantalla.jpg" alt="Monitor">
                <div class="producto-info">
                    <h2>Hikvision 21.5 inch FHD IPS 100Hz</h2>
                    <p class="precio">Q1,036.10</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="img/vidriotemplado.jpg" alt="Vidrio templado">
                <div class="producto-info">
                    <h2>Belkin Tempered Glass OVI008fq</h2>
                    <p class="precio">Q372.20</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="img/funda.jpg" alt="Funda para Notebook">
                <div class="producto-info">
                    <h2>Funda Argom 14″ para Notebook</h2>
                    <p class="precio">Q41.33</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="img/procesador.jpg" alt="Procesador AMD Ryzen 9 9950x">
                <div class="producto-info">
                    <h2>AMD RYZEN 9 9950X AM5</h2>
                    <p class="precio">Q6,101.72</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>
        <hr>
        <h2>To-Do List</h2>

        <!-- TODO: Layout de Todo List
             Lista de tareas estilizada con:
             - Checkbox para marcar completado
             - Texto de la tarea
             - Diseño limpio y accesible
        -->
        <section class="todo-list">
            <ul class="tareas" role="list">
                <li class="tarea">
                    <input type="checkbox" id="t1">
                    <label for="t1">Aprender CSS Grid</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t2">
                    <label for="t2">Practicar Flexbox</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t3">
                    <label for="t3">Estudiar diseño responsivo</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t4">
                    <label for="t4">Hacer la tarea de CSS</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t5">
                    <label for="t5">Revisar novedades de CSS 2024</label>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
